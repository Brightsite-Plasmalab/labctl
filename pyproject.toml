[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "labctl"
version = "0.0.2"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "numpy",
    "typing-extensions",
]

authors = [
    {name = "Martijn Ruijzendaal", email = "martijn.ruijzendaal@gmail.com"},
    {name = "Thijs Drost", email = "thijs.drost@maastrichtuniversity.nl"}
]

[project.urls]
repository = "https://github.com/Brightsite-Plasmalab"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
analysis = [
    "sif-parser>=0.3.6",
    "matplotlib>=3.10.7",
    "scipy",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyrefly>=0.60.0",
    "scipy-stubs[scipy]",
    "ruff>=0.16.10",

    "sphinx>=9.0.4",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx-autodoc-typehints",
    {include-group = "analysis"},
]
gui = [
    "pyserial>=3.5",
    "PyQt5",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov=labctl",
    "--cov-branch",
    "--cov-report=term-missing",
]
testpaths = [
    "tests"
]

[tool.pyrefly]
preset = "default"
